server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : toute route inconnue rend index.html, c'est le
    # routeur JavaScript qui décide ensuite quoi afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par Vite (nom + empreinte) ne changent jamais.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ceux-ci doivent être revalidés à chaque fois, sans quoi une mise à jour
    # n'atteindrait jamais les navigateurs déjà installés.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
